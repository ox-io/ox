name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --release -p ox-cli
      - name: Select binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "OX_BINARY=target/release/ox.exe" >> "$GITHUB_ENV"; else echo "OX_BINARY=target/release/ox" >> "$GITHUB_ENV"; fi
      - shell: bash
        run: sha256sum "$OX_BINARY" > "$OX_BINARY.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.OX_BINARY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ox-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ env.OX_BINARY }}
            ${{ env.OX_BINARY }}.sha256
