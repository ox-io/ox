name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --release -p ox-cli
      - name: Select binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "OX_BINARY=target/release/ox.exe" >> "$GITHUB_ENV"; else echo "OX_BINARY=target/release/ox" >> "$GITHUB_ENV"; fi
      - shell: bash
        run: sha256sum "$OX_BINARY" > "$OX_BINARY.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.OX_BINARY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ox-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ env.OX_BINARY }}
            ${{ env.OX_BINARY }}.sha256

  publish:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Normalize asset names
        shell: bash
        run: |
          mkdir release
          for directory in dist/*; do
            label="$(basename "$directory")"
            if [ -f "$directory/ox.exe" ]; then extension=".exe"; else extension=""; fi
            cp "$directory/ox$extension" "release/$label$extension"
            sha256sum "release/$label$extension" > "release/$label$extension.sha256"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes $prerelease
